<div class="play-title-page">
  <h1 class="play-title">{{ title }}</h1>
  {{#if subtitle}}<p class="play-subtitle">{{ subtitle }}</p>{{/if}}
  {{#if author}}<p class="play-by">by</p><p class="play-author">{{ author }}</p>{{/if}}
  {{#if draft}}<p class="play-subtitle">{{ draft }}</p>{{/if}}
  {{#if contact}}<p class="play-contact">{{ contact }}</p>{{/if}}
</div>
